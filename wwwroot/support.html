<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="meta.supportTitle">Служба поддержки</title>
    <link rel="stylesheet" href="styles.css?v=6" />
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="logo">TicketPro</div>
            <div class="profile-mini"><span class="avatar"></span><span id="profile-output">support</span></div>
            <nav class="menu">
                <a href="/support.html" class="active" data-i18n="nav.ratings">Рейтинг</a>
                <a href="/login.html" data-i18n="nav.login">Вход</a>
            </nav>
        </aside>

        <main class="main-area">
            <header class="app-topbar">
                <div class="left">
                    <button id="sidebar-toggle" class="icon-btn" type="button" data-i18n-aria-label="top.menu" aria-label="Меню">☰</button>
                    <nav class="topnav" data-i18n-aria-label="nav.mainNav" aria-label="Навигация">
                        <a href="/support.html" class="active" data-i18n="nav.ratings">Рейтинг</a>
                        <a href="/" data-i18n="nav.home">Главная</a>
                    </nav>
                </div>
                <div class="right">
                    <div class="lang-switch" role="group">
                        <button type="button" class="ghost-btn lang-btn" data-set-lang="ru" data-i18n="lang.ru">Русский</button>
                        <button type="button" class="ghost-btn lang-btn" data-set-lang="ky" data-i18n="lang.ky">Кыргызча</button>
                    </div>
                    <span class="chip" id="role-chip">SupportAgent</span>
                    <button id="load-ratings-btn" class="ghost-btn" type="button" data-i18n="top.refresh">Обновить</button>
                    <div class="notif-bell-wrap">
                        <button class="icon-btn notif-bell-btn" type="button" id="notif-bell-btn" data-i18n-aria-label="notify.bell" aria-label="Уведомления">🔔<span class="notif-badge" id="notif-badge" style="display:none">0</span></button>
                        <div class="notif-dropdown" id="notif-dropdown" style="display:none">
                            <div class="notif-dropdown-header"><span data-i18n="notify.newTickets">Новые тикеты</span><button type="button" id="notif-clear-btn" data-i18n="notify.clear">Очистить</button></div>
                            <div id="notif-list" class="notif-list"></div>
                        </div>
                    </div>
                    <div class="profile-pill" data-i18n-title="top.profileTitle" title="Профиль">
                        <span class="avatar"></span>
                        <span class="name" id="topbar-profile">support</span>
                    </div>
                    <a class="link-btn ghost" href="/profile.html" data-i18n="top.profileLink">Профиль</a>
                    <button id="logout-btn" class="ghost-btn" type="button" data-i18n="top.logout">Выйти</button>
                </div>
            </header>

            <section class="card">
                <h2 data-i18n="support.myRating">Мой рейтинг</h2>
                <p class="muted" data-i18n="support.metricsHint">Метрики считаются автоматически по назначенным тикетам и ответам.</p>
            </section>

            <section class="table-card" style="margin-top:16px;">
                <div class="table-head" style="grid-template-columns: 1fr 110px 110px 170px 170px;">
                    <div data-i18n="table.colEmployee">Сотрудник</div>
                    <div data-i18n="table.colAssigned">Назначено</div>
                    <div data-i18n="table.colClosed">Закрыто</div>
                    <div data-i18n="table.colFirstResponse">Первый ответ</div>
                    <div data-i18n="table.colResolution">Решение</div>
                </div>
                <div id="ratings-list"></div>
            </section>
        </main>
    </div>

    <script type="module">
        import { applyDomI18n, bindLangSwitch, t } from "./i18n.js?v=4";
        import { api, clearToken, requireAuth } from "./common.js?v=4";
        import { initNotifications } from "./notifications.js?v=2";
        import { initNotifBell } from "./notifbell.js?v=1";

        applyDomI18n();
        bindLangSwitch();

        const me = await requireAuth(["SupportAgent", "Admin"]);
        if (!me) {
            throw new Error("Forbidden");
        }

        void initNotifications();
        initNotifBell();

        document.getElementById("profile-output").textContent = `${me.name} ${me.surname}`;
        document.getElementById("topbar-profile").textContent = `${me.name} ${me.surname}`;
        document.getElementById("role-chip").textContent = me.roles.join(", ");

        document.getElementById("sidebar-toggle").addEventListener("click", () => {
            document.querySelector(".app-shell").classList.toggle("sidebar-collapsed");
        });

        document.getElementById("logout-btn").addEventListener("click", () => {
            clearToken();
            window.location.href = "/login.html";
        });

        const ratingsList = document.getElementById("ratings-list");

        function fmtMinutes(value) {
            if (value === null || value === undefined) return "—";
            const m = t("time.minShort");
            const h = t("time.hourShort");
            if (value < 60) return `${Math.round(value)} ${m}`;
            const hours = value / 60;
            return `${hours.toFixed(hours < 10 ? 1 : 0)} ${h}`;
        }

        function fmtHours(value) {
            if (value === null || value === undefined) return "—";
            const m = t("time.minShort");
            const h = t("time.hourShort");
            if (value < 1) return `${Math.round(value * 60)} ${m}`;
            return `${value.toFixed(value < 10 ? 1 : 0)} ${h}`;
        }

        function renderRatings(items) {
            if (!items || items.length === 0) {
                ratingsList.innerHTML = `<div class='table-row'><div class='muted'>${t("table.noData")}</div></div>`;
                return;
            }
            ratingsList.innerHTML = items.map((r) => `
                <div class="table-row" style="grid-template-columns: 1fr 110px 110px 170px 170px;">
                    <div>
                        <div class="ticket-title">${r.agentName}</div>
                        <div class="meta">${r.agentEmail}</div>
                    </div>
                    <div>${r.assignedTotal}</div>
                    <div>${r.closedTotal}</div>
                    <div>${fmtMinutes(r.avgFirstResponseMinutes)}</div>
                    <div>${fmtHours(r.avgResolutionHours)}</div>
                </div>
            `).join("");
        }

        async function loadRatings() {
            try {
                const data = await api("/api/SupportRatings");
                renderRatings(data);
            } catch (err) {
                ratingsList.innerHTML = `<div class="table-row"><div class="muted">${err.message}</div></div>`;
            }
        }

        document.getElementById("load-ratings-btn").addEventListener("click", loadRatings);
        await loadRatings();
    </script>
</body>
</html>
