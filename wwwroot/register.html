<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="meta.registerTitle">Регистрация</title>
    <link rel="stylesheet" href="styles.css?v=4" />
</head>
<body>
    <main class="container narrow">
        <div class="page-head">
            <h1 data-i18n="register.title">Регистрация</h1>
            <div class="lang-switch" role="group">
                <button type="button" class="ghost-btn lang-btn" data-set-lang="ru" data-i18n="lang.ru">Русский</button>
                <button type="button" class="ghost-btn lang-btn" data-set-lang="ky" data-i18n="lang.ky">Кыргызча</button>
            </div>
        </div>
        <section class="card">
            <p class="muted">
                <span data-i18n="register.hint">Пароль — не короче 8 символов...</span>
                <a href="/login.html" data-i18n="register.hintLogin">Вход</a>.
            </p>
            <form id="register-form">
                <input name="name" data-i18n-placeholder="register.namePh" placeholder="Имя" required />
                <input name="surname" data-i18n-placeholder="register.surnamePh" placeholder="Фамилия" required />
                <input name="email" type="email" data-i18n-placeholder="register.emailPh" placeholder="Email" required />
                <input name="userName" data-i18n-placeholder="register.userNamePh" placeholder="Username (уникальное)" required />
                <input name="phoneNumber" data-i18n-placeholder="register.phonePh" placeholder="Телефон" required />
                <input name="password" type="password" data-i18n-placeholder="register.passwordPh" placeholder="Пароль (мин. 8 символов)" required minlength="8" autocomplete="new-password" />
                <button type="submit" data-i18n="register.submit">Зарегистрироваться</button>
            </form>
            <div class="row">
                <a class="link-btn ghost" href="/login.html" data-i18n="register.hasAccount">Уже есть аккаунт</a>
                <a class="link-btn ghost" href="/" data-i18n="register.toHome">На главную</a>
            </div>
            <pre id="register-output" class="output"></pre>
        </section>
    </main>

    <script type="module">
        import { applyDomI18n, bindLangSwitch, t } from "./i18n.js?v=4";
        import { api, setOutput } from "./common.js?v=4";

        applyDomI18n();
        bindLangSwitch();

        document.getElementById("register-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const f = e.target;
            try {
                const payload = {
                    name: f.name.value,
                    surname: f.surname.value,
                    email: f.email.value,
                    userName: f.userName.value,
                    phoneNumber: f.phoneNumber.value,
                    password: f.password.value
                };
                const userId = await api("/api/Auth/Register", {
                    method: "POST",
                    body: JSON.stringify(payload),
                    skipAuth: true
                });
                setOutput("register-output", { message: t("register.success"), userId });
                f.reset();
            } catch (err) {
                setOutput("register-output", err.message);
            }
        });
    </script>
</body>
</html>
