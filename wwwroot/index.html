<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="meta.indexTitle">Ticket Support System</title>
    <link rel="stylesheet" href="styles.css?v=4" />
</head>
<body>
    <main class="container">
        <div class="page-head">
            <h1 data-i18n="home.title">Ticket Support System</h1>
            <div class="lang-switch" role="group">
                <button type="button" class="ghost-btn lang-btn" data-set-lang="ru" data-i18n="lang.ru">Русский</button>
                <button type="button" class="ghost-btn lang-btn" data-set-lang="ky" data-i18n="lang.ky">Кыргызча</button>
            </div>
        </div>
        <p class="hint" data-i18n="home.subtitle">Выберите действие:</p>

        <section class="card">
            <div class="row">
                <a class="link-btn" href="/login.html" data-i18n="home.login">Войти</a>
                <a class="link-btn" href="/register.html" data-i18n="home.register">Регистрация</a>
            </div>
            <p class="hint" data-i18n="home.redirectHint">Если вы уже вошли, система автоматически перенаправит в нужный кабинет.</p>
            <pre id="home-output" class="output"></pre>
        </section>
    </main>

    <script type="module">
        import { applyDomI18n, bindLangSwitch, t } from "./i18n.js?v=4";
        import { getCurrentUser } from "./common.js?v=4";

        applyDomI18n();
        bindLangSwitch();

        const output = document.getElementById("home-output");

        try {
            const me = await getCurrentUser();
            if (!me) {
                output.textContent = t("home.notAuth");
            } else if (me.roles.includes("Admin")) {
                window.location.href = "/admin.html";
            } else if (me.roles.includes("SupportAgent")) {
                window.location.href = "/support.html";
            } else {
                window.location.href = "/user.html";
            }
        } catch (e) {
            output.textContent = e.message;
        }
    </script>
</body>
</html>
