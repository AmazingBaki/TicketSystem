<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticket Support System</title>
    <link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
    <main class="container">
        <h1>Ticket Support System</h1>
        <p class="hint">Выберите действие:</p>

        <section class="card">
            <div class="row">
                <a class="link-btn" href="/login.html">Войти</a>
                <a class="link-btn" href="/register.html">Регистрация</a>
            </div>
            <p class="hint">Если вы уже вошли, система автоматически перенаправит в нужный кабинет.</p>
            <pre id="home-output" class="output"></pre>
        </section>
    </main>

    <script type="module">
        import { getCurrentUser } from "./common.js?v=3";

        const output = document.getElementById("home-output");

        try {
            const me = await getCurrentUser();
            if (!me) {
                output.textContent = "Вы не авторизованы.";
            } else if (me.roles.includes("Admin")) {
                window.location.href = "/admin.html";
            } else if (me.roles.includes("SupportAgent")) {
                window.location.href = "/support.html";
            } else {
                window.location.href = "/user.html";
            }
        } catch (e) {
            output.textContent = e.message;
        }
    </script>
</body>
</html>
